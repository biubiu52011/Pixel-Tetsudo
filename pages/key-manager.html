<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https:; object-src none;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODPT API キー管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #f5f5f7; padding: 40px 20px; max-width: 500px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 10px; color: #1c1c1e; }
p { color: #8e8e93; margin-bottom: 24px; font-size: 14px; }
.card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: #1c1c1e; margin-bottom: 6px; }
input { width: 100%; padding: 12px 14px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 14px; transition: border-color 0.2s; }
input:focus { outline: none; border-color: #00a859; }
.btn { width: 100%; padding: 14px; background: #00a859; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
.btn:hover { background: #00904d; }
.btn-secondary { background: #f0f0f0; color: #1c1c1e; }
.btn-secondary:hover { background: #e5e5ea; }
.btn-danger { background: #ff4757; }
.btn-danger:hover { background: #e83e4d; }
.status { padding: 12px; border-radius: 10px; margin-top: 16px; font-size: 13px; display: none; }
.status.show { display: block; }
.status.success { background: rgba(0,168,89,0.1); color: #00a859; }
.status.error { background: rgba(255,71,87,0.1); color: #ff4757; }
</style>
</head>
<body>
<h1>ODPT API キー管理</h1>
<p>ODPT APIのCenterキーとChallengeキーを設定・管理します</p>
<div class="card">
  <div class="form-group">
    <label>Center API キー</label>
    <input type="text" id="centerKey" placeholder="Center API キーを入力">
  </div>
  <div class="form-group">
    <label>Challenge API キー</label>
    <input type="text" id="challengeKey" placeholder="Challenge API キーを入力">
  </div>
  <button class="btn" onclick="saveKeys()">保存する</button>
  <button class="btn btn-secondary" onclick="window.location.href='realtime.html'">ホームに戻る</button>
  <button class="btn btn-danger" id="clearBtn" onclick="clearKeys()" style="display:none;">削除する</button>
  <div id="status" class="status"></div>
</div>
<div class="card">
  <h3 style="margin-bottom:12px;font-size:16px;">ODPT API キーの取得方法</h3>
  <ol style="padding-left:20px;line-height:1.8;color:#555;font-size:14px;">
    <li>http://odpt.org/ に登録し、APIキーを発行してください</li>
    <li>Center API と Challenge API の2種類のキーが必要です</li>
    <li>Center API キーを下のフォームに入力して保存</li>
    <li>Challenge API キーはJR東日本利用時のみ必要</li>
  </ol>
</div>
<script>
// Load ODPT module for cryptoEncrypt
var _odptReady = false;
(function checkODPT() {
  if (typeof cryptoEncrypt === 'function') { _odptReady = true; }
  else { setTimeout(checkODPT, 100); }
})();

async function saveKeys() {
  var centerKey = document.getElementById('centerKey').value.trim();
  var challengeKey = document.getElementById('challengeKey').value.trim();
  var statusEl = document.getElementById('status');
  if (!centerKey || !challengeKey) { statusEl.className = 'status show error'; statusEl.textContent = '両方のキーを入力してください'; return; }
  if (!_odptReady) { statusEl.className = 'status show error'; statusEl.textContent = 'システム読み込み中…もう一度押してください'; return; }
  try {
    var plain = 'ODPT_CENTER:' + centerKey + '|CHALLENGE_2026:' + challengeKey;
    var encoded = await cryptoEncrypt(plain, centerKey + challengeKey);
    localStorage.setItem('odpt_keys_enc', encoded);
    localStorage.removeItem('odpt_keys_b64');
    statusEl.className = 'status show success'; statusEl.textContent = 'キーを保存しました';
    document.getElementById('clearBtn').style.display = 'block';
  } catch(e) { statusEl.className = 'status show error'; statusEl.textContent = '保存エラー: ' + e.message; }
}
function clearKeys() {
  localStorage.removeItem('odpt_keys_b64');
  localStorage.removeItem('odpt_keys_enc');
  document.getElementById('clearBtn').style.display = 'none';
  var statusEl = document.getElementById('status');
  statusEl.className = 'status show success'; statusEl.textContent = 'キーを削除しました';
  document.getElementById('centerKey').value = '';
  document.getElementById('challengeKey').value = '';
}
window.addEventListener('DOMContentLoaded', function() {
  var stored = localStorage.getItem('odpt_keys_b64');
  if (stored) {
    document.getElementById('clearBtn').style.display = 'block';
    try {
      var decoded = atob(stored);
      decoded.split('|').forEach(function(pair) {
        var idx = pair.indexOf(':');
        if (idx > 0) {
          var name = pair.substring(0, idx).trim();
          var value = pair.substring(idx + 1).trim();
          if (name === 'ODPT_CENTER') document.getElementById('centerKey').value = value;
          if (name === 'CHALLENGE_2026') document.getElementById('challengeKey').value = value;
        }
      });
    } catch(e) {}
  }
});
</script>
</body>
</html>
