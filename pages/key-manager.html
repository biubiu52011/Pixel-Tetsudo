<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https:; upgrade-insecure-requests;; frame-src https://www.openstreetmap.org; object-src none;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()"><meta name="referrer" content="strict-origin-when-cross-origin"><title>ODPT API キー管理</title>
<link rel="stylesheet" href="../css/key-manager.css">
</head>
<body>
<h1>ODPT API キー管理</h1>
<p>ODPT APIのCenterキーとChallengeキーを設定・管理します</p>
<div class="card">
  <div class="form-group">
    <label>Center API キー</label>
    <input type="text" id="centerKey" autocomplete="new-password" spellcheck="false" placeholder="Center API キーを入力">
  </div>
  <div class="form-group">
    <label>Challenge API キー</label>
    <input type="text" id="challengeKey" autocomplete="new-password" spellcheck="false" placeholder="Challenge API キーを入力">
  </div>
  <button class="btn" onclick="saveKeys()">保存する</button>
  <button class="btn btn-secondary" onclick="window.location.href='realtime.html'">ホームに戻る</button>
  <button class="btn btn-danger" id="clearBtn" class="btn-danger hidden" onclick="clearKeys()">削除する</button>
  <div id="status" class="status"></div>
</div>
<div class="card">
  <h3>ODPT API キーの取得方法</h3>
  <ol>
    <li>http://odpt.org/ に登録し、APIキーを発行してください</li>
    <li>Center API と Challenge API の2種類のキーが必要です</li>
    <li>Center API キーを下のフォームに入力して保存</li>
    <li>Challenge API キーはJR東日本利用時のみ必要</li>
  </ol>
</div>
<script src="../js/security.js"></script><script src="../js/key-manager.js"></script>
</body>
</html>
