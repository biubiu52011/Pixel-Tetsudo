<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https:; upgrade-insecure-requests; frame-src https://www.openstreetmap.org; object-src none;"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#008803"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="Pixel Tetsudo - Route Search"><meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Pixel Tetsudo</title><link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/lang-bar.css">
<link rel="stylesheet" href="../css/tourism-styles.css">
</head>
<body>
<div id="app">
<header class="pixel-header">

<div class="header-container">
<div class="header-text">
<h1 class="pixel-title" data-i18n="app.title">
Pixel Tetsudo</h1>
</div>
<div class="lang-switcher-wrapper">
<button id="langToggleBtn" class="lang-toggle-btn" title="Switch Language" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch language">
<img src="../images/Language.png" alt="Language" class="lang-icon"></button>
<div id="langSwitcher" class="lang-switcher">
<div class="lang-options" role="listbox" aria-label="Select language">
<button class="lang-btn active" data-lang="ja" role="option" aria-selected="true">
日本語</button>
<button class="lang-btn" data-lang="zh">
中文</button>
<button class="lang-btn" data-lang="ko" role="option" aria-selected="false">
한국어</button>
<button class="lang-btn" data-lang="en" role="option" aria-selected="false">
English</button>
</div>
</div>
</div>
</div>
</header>

<nav class="pixel-tabs">
<a href="home.html" class="tab-btn active" data-tab="search" data-i18n="tab.search">
線路検索</a><a href="realtime.html" class="tab-btn" data-tab="status" data-i18n="tab.status">
運行状況</a>
<a href="trains.html" class="tab-btn" data-tab="trains" data-i18n="tab.trains">
列車リアルタイム</a>
<a href="history.html" class="tab-btn" data-tab="history" data-i18n="tab.history">
履歴</a>
</nav>
<section id="tab-search" class="tab-content active">
<div id="searchContainer" class="search-card pixel-card">
<div class="search-inputs">
<div class="input-group">
<label class="input-label" data-i18n="search.fromLabel">
出発駅</label>
<input type="text" id="searchFrom" class="search-input" data-i18n-placeholder="search.fromPlaceholder" placeholder="出発駅を入力"><div id="fromSuggestions" class="suggestions">
</div>
</div>
<div class="input-group">
<label class="input-label" data-i18n="search.toLabel">
到着駅</label>
<input type="text" id="searchTo" class="search-input" data-i18n-placeholder="search.toPlaceholder" placeholder="到着駅を入力"><div id="toSuggestions" class="suggestions">
</div>
</div>
<button id="searchBtn" class="search-btn" data-i18n="search.btn">
検索</button>
</div>
<div id="searchResults" class="search-results">
</div>
</div>
<div id="smModule" class="sm-module pixel-card">
  <div class="sm-header">
    <h2 data-i18n="tourism.title">
観光ガイド</h2>
  </div>
  <div class="sm-location-bar">
    <div class="sm-location-info">
      <span class="sm-location-label" data-i18n="tourism.select_station">
近くの駅</span>
      <span id="smStationDisplay" class="sm-station-display">
</span>
    </div>
    <button id="smRelocateBtn" class="sm-relocate-btn" title="現在位置に更新" aria-label="Relocate to current position">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="2" x2="8" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="12" x2="8" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="8" x2="4" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
</button>
  </div>
  <div id="smTagFilters" class="sm-tag-filters">
</div>
  <div class="sm-content">
    <div id="smGrid" class="sm-grid">
</div>
    <div id="smEmpty" class="sm-empty hidden">
            <span data-i18n="tourism.no_spots">
觀光スポットがいません</span>
    </div>
  </div>
</div>
<section id="tab-status" class="tab-content">
</section>
<section id="tab-trains" class="tab-content">
</section>
<section id="tab-history" class="tab-content">
</section>\n</section>\n<footer class="pixel-footer" data-i18n="app.footer">
© 2026 Pixel Tetsudo</footer>
</div>
<script src="../data/core/db-loader.js"></script><script src="../js/translations.js"></script><script src="../js/common.js"></script><script src="../js/lang-init.js"></script><script src="../js/route-search.js"></script><script src="../js/search-ui.js"></script><script src="../js/sightseeing.js"></script><script src="../js/tab-switch.js"></script><script src="../js/history.js"></script></body>
</html>
