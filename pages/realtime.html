<div id="app" data-site-shell-root>

    <div class="rs-modal-content">
      <div class="rs-modal-header">

      </div>
      <div class="rs-modal-body">
        <div class="rs-status-section">
          <span class="rs-status-indicator"><span></span><span class="rs-status-text"></span></span>
        </div>
        <div class="rs-interval-section">
          <div class="rs-info-label"></div>
          <div class="rs-interval-stations"></div>
        </div>
        <div class="rs-cause-section">
          <div class="rs-section-title"></div>
          <div class="rs-cause-text"></div>
        </div>
        <div class="rs-updated-section">
          <div class="rs-info-label"></div>
          <div class="rs-updated-time"></div>
        </div>
      </div>
    </div>
  </div>
</div>
