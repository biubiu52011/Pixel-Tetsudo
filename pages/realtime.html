  <meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body data-page="status">
<div id="app">
  <section id="tab-status" class="tab-content active">
    <div id="realtimeFilterBar" class="rs-filter-bar"></div>
    <div id="realtimeStatusContainer" class="pixel-card"></div>
  </section>

  <div id="lineDetailModal" class="rs-modal">
    <div class="rs-modal-content">
      <div class="rs-modal-header">
        <button class="rs-modal-close" aria-label="close"><svg class="pt-icon" viewBox="0 0 14 14" width="12" height="12" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path fill-rule="evenodd" clip-rule="evenodd" d="M1.707.293A1 1 0 0 0 .293 1.707L5.586 7 .293 12.293a1 1 0 1 0 1.414 1.414L7 8.414l5.293 5.293a1 1 0 0 0 1.414-1.414L8.414 7l5.293-5.293A1 1 0 0 0 12.293.293L7 5.586z"/></svg></button>
        <h2 class="rs-modal-title"></h2>
      </div>
      <div class="rs-modal-body">
        <div class="rs-status-section">
          <span class="rs-status-indicator"><span></span><span class="rs-status-text"></span></span>
        </div>
        <div class="rs-interval-section">
          <div class="rs-info-label"></div>
          <div class="rs-interval-stations"></div>
        </div>
        <div class="rs-cause-section">
          <div class="rs-section-title"></div>
          <div class="rs-cause-text"></div>
        </div>
        <div class="rs-updated-section">
          <div class="rs-info-label"></div>
          <div class="rs-updated-time"></div>
        </div>
      </div>
    </div>
  </div>
</div>
