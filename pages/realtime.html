<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https:; upgrade-insecure-requests; frame-src https://www.openstreetmap.org; object-src none;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#008803">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Pixel Tetsudo - Realtime Status">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Pixel Tetsudo</title>
  <link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/lang-bar.css">
  <link rel="stylesheet" href="../css/realtime.css">
</head>
<body>
<div id="app">
  <header class="pixel-header">
    <div class="header-container">
      <div class="header-text">
        <h1 class="pixel-title" data-i18n="app.title">Pixel Tetsudo</h1>
      </div>
      <div class="lang-switcher-wrapper">
        <button id="langToggleBtn" class="lang-toggle-btn" title="Switch Language" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch language">
          <img src="../images/Language.png" alt="Language" class="lang-icon">
        </button>
        <div id="langSwitcher" class="lang-switcher">
          <div class="lang-options" role="listbox" aria-label="Select language">
            <button class="lang-btn active" data-lang="ja" role="option" aria-selected="true">日本語</button>
            <button class="lang-btn" data-lang="zh" role="option" aria-selected="false">中文</button>
            <button class="lang-btn" data-lang="ko" role="option" aria-selected="false">한국어</button>
            <button class="lang-btn" data-lang="en" role="option" aria-selected="false">English</button>
          </div>
      <button id="configBtn" class="config-btn" title="API Keys" aria-label="config.title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </button>
    </div>
</div>
</div>
</header>

  <nav class="pixel-tabs"><a href="home.html" class="tab-btn" data-tab="search" data-i18n="tab.search">路線検索</a><a href="realtime.html" class="tab-btn active" data-tab="status" data-i18n="tab.status">運行状況</a><a href="trains.html" class="tab-btn" data-tab="trains" data-i18n="tab.trains">列車リアルタイム</a><a href="history.html" class="tab-btn" data-tab="history" data-i18n="tab.history">履歴</a></nav>

  <section id="tab-search" class="tab-content"></section>
<section id="tab-status" class="tab-content active">
    <div id="realtimeStatusContainer" class="pixel-card"></div>
  </section>
<section id="tab-trains" class="tab-content"></section>
<section id="tab-history" class="tab-content"></section>

  <footer class="pixel-footer" data-i18n="app.footer">© 2026 Pixel Tetsudo</footer>

  <div id="lineDetailModal" class="rs-modal">
    <div class="rs-modal-content">
      <div class="rs-modal-header">
        <button class="rs-modal-close" aria-label="close">×</button>
        <h2 class="rs-modal-title"></h2>
      </div>
      <div class="rs-modal-body"></div>
    </div>
  </div>

  <div id="keyConfigModal" class="rs-modal" style="display:none">
    <div class="rs-modal-content rs-key-config">
      <div class="rs-modal-header">
        <span class="rs-modal-title" data-i18n="config.title">API Key Settings</span>
        <button class="rs-modal-close" id="keyConfigClose" aria-label="close">×</button>
      </div>
      <div class="rs-modal-body">
        <p class="rs-key-hint" data-i18n="config.hint">Enter your ODPT API keys to load real-time data.<br>
          <a href="https://odpt.org" target="_blank" rel="noopener">odpt.org</a> for free registration.</p>
        <div class="rs-key-field">
          <label for="centerKey" data-i18n="config.center_key">Center Key</label>
          <input type="password" id="centerKey" autocomplete="off" spellcheck="false" placeholder="ODPT_CENTER key" data-i18n-placeholder="config.center_key_placeholder">
        </div>
        <div class="rs-key-field">
          <label for="challengeKey" data-i18n="config.challenge_key">Challenge Key</label>
          <input type="password" id="challengeKey" autocomplete="off" spellcheck="false" placeholder="CHALLENGE key" data-i18n-placeholder="config.challenge_key_placeholder">
        </div>
        <div id="keyStatus" class="rs-key-status"></div>
        <div class="rs-key-actions">
          <button id="saveKeysBtn" class="rs-key-btn rs-key-save" data-i18n="config.save">Save &amp; Update</button>
          <button id="clearKeysBtn" class="rs-key-btn rs-key-clear hidden" data-i18n="config.clear">Clear Keys</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../data/core/db-loader.js"></script>
<script src="../js/data-state.js"></script>
<script src="../data/api/odpt-unified.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/common.js"></script>
<script src="../js/lang-init.js"></script>
<script src="../js/tab-switch.js" defer></script>
<script src="../js/data-fusion.js"></script>
<script src="../js/realtime-view.js"></script>
</body>
</html>
