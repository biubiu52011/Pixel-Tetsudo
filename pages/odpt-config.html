<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODPT API 密钥配置 | PIXEL TETSUDO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; margin-bottom: 8px; color: #1c1c1e; }
  .subtitle { color: #8e8e93; margin-bottom: 30px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #1c1c1e; margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e5e5ea;
    border-radius: 10px;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: #00a859; }
  .btn {
    width: 100%;
    padding: 14px;
    background: #00a859;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #00904d; }
  .btn-secondary {
    background: #f0f0f5;
    color: #1c1c1e;
    margin-top: 10px;
  }
  .btn-secondary:hover { background: #e5e5ea; }
  .status {
    padding: 12px 16px;
    border-radius: 10px;
    margin-top: 16px;
    font-size: 14px;
  }
  .status.success { background: rgba(0,168,89,0.1); color: #00a859; }
  .status.error { background: rgba(255,71,87,0.1); color: #ff4757; }
  .info { font-size: 13px; color: #8e8e93; margin-top: 8px; }
  a { color: #00a859; text-decoration: none; }
</style>
</head>
<body>
<h1>ODPT API 密钥配置</h1>
<p class="subtitle">请输入您的 ODPT API 密钥以启用实时数据</p>

<div class="card">
  <div class="form-group">
    <label>Center API 密钥</label>
    <input type="text" id="centerKey" placeholder="输入 Center API 密钥">
    <p class="info">用于地铁、私铁等线路的实时信息</p>
  </div>
  <div class="form-group">
    <label>Challenge API 密钥</label>
    <input type="text" id="challengeKey" placeholder="输入 Challenge API 密钥">
    <p class="info">用于 JR、近铁等线路的实时信息</p>
  </div>
  <button class="btn" onclick="saveKeys()">保存密钥</button>
  <button class="btn btn-secondary" onclick="window.location.href='realtime.html'">返回运行状态</button>
  <div id="status"></div>
</div>

<div class="card">
  <h3 style="margin-bottom: 12px; font-size: 16px;">如何获取 API 密钥？</h3>
  <ol style="padding-left: 20px; line-height: 1.8; color: #555;">
    <li>访问 <a href="https://odpt.org/" target="_blank">odpt.org</a> 注册账号</li>
    <li>在控制台创建应用，获取 API 密钥</li>
    <li>Center API 密钥用于地铁线路</li>
    <li>Challenge API 密钥用于 JR 和私铁线路</li>
  </ol>
</div>

<script>
function saveKeys() {
  var centerKey = document.getElementById('centerKey').value.trim();
  var challengeKey = document.getElementById('challengeKey').value.trim();
  var statusEl = document.getElementById('status');
  
  if (!centerKey || !challengeKey) {
    statusEl.className = 'status error';
    statusEl.textContent = '请输入完整的 API 密钥';
    return;
  }
  
  if (typeof KeyManager !== 'undefined') {
    KeyManager.setKeys(centerKey, challengeKey);
    statusEl.className = 'status success';
    statusEl.textContent = '密钥已保存到 localStorage';
  } else {
    var encoded = btoa('ODPT_CENTER:' + centerKey + '|CHALLENGE_2026:' + challengeKey);
    localStorage.setItem('odpt_keys_b64', encoded);
    statusEl.className = 'status success';
    statusEl.textContent = '密钥已保存到 localStorage';
  }
}

// Check if keys are already saved
window.addEventListener('DOMContentLoaded', function() {
  var stored = localStorage.getItem('odpt_keys_b64');
  if (stored) {
    try {
      var decoded = atob(stored);
      var parts = decoded.split('|');
      var centerKey = '', challengeKey = '';
      parts.forEach(function(pair) {
        var idx = pair.indexOf(':');
        if (idx > 0) {
          var name = pair.substring(0, idx).trim();
          var value = pair.substring(idx + 1).trim();
          if (name === 'ODPT_CENTER') centerKey = value;
          if (name === 'CHALLENGE_2026') challengeKey = value;
        }
      });
      document.getElementById('centerKey').value = centerKey;
      document.getElementById('challengeKey').value = challengeKey;
    } catch(e) {}
  }
});
</script>
</body>
</html>
