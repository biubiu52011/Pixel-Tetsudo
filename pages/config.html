<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置 ODPT API 密钥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    padding: 40px 20px;
    max-width: 500px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 10px; color: #1c1c1e; }
  p { color: #8e8e93; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #1c1c1e; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e5e5ea;
    border-radius: 10px;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: #00a859; }
  .btn {
    width: 100%;
    padding: 14px;
    background: #00a859;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #00904d; }
  .btn-secondary {
    background: #f0f0f5;
    color: #1c1c1e;
    margin-top: 10px;
  }
  .btn-secondary:hover { background: #e5e5ea; }
  .status {
    padding: 12px;
    border-radius: 10px;
    margin-top: 16px;
    font-size: 13px;
    display: none;
  }
  .status.show { display: block; }
  .status.success { background: rgba(0,168,89,0.1); color: #00a859; }
  .status.error { background: rgba(255,71,87,0.1); color: #ff4757; }
  .hint { font-size: 12px; color: #8e8e93; margin-top: 6px; }
</style>
</head>
<body>
<h1>配置 ODPT API 密钥</h1>
<p>请输入您的 ODPT API 密钥以启用实时数据</p>

<div class="card">
  <div class="form-group">
    <label>Center API 密钥</label>
    <input type="text" id="centerKey" placeholder="输入 Center API 密钥">
    <p class="hint">用于地铁、都营、 Yokohama 市营等线路</p>
  </div>
  <div class="form-group">
    <label>Challenge API 密钥</label>
    <input type="text" id="challengeKey" placeholder="输入 Challenge API 密钥">
    <p class="hint">用于 JR、私铁等线路</p>
  </div>
  <button class="btn" onclick="saveKeys()">保存密钥</button>
  <button class="btn btn-secondary" onclick="window.location.href='realtime.html'">返回运行状态</button>
  <div id="status" class="status"></div>
</div>

<script>
function saveKeys() {
  var centerKey = document.getElementById('centerKey').value.trim();
  var challengeKey = document.getElementById('challengeKey').value.trim();
  var statusEl = document.getElementById('status');
  
  if (!centerKey || !challengeKey) {
    statusEl.className = 'status show error';
    statusEl.textContent = '请输入完整的 API 密钥';
    return;
  }
  
  var encoded = btoa('ODPT_CENTER:' + centerKey + '|CHALLENGE_2026:' + challengeKey);
  localStorage.setItem('odpt_keys_b64', encoded);
  
  statusEl.className = 'status show success';
  statusEl.textContent = '密钥已保存到 localStorage，正在刷新页面...';
  
  setTimeout(function() {
    window.location.href = 'realtime.html';
  }, 1000);
}

// 检查是否已有密钥
window.addEventListener('DOMContentLoaded', function() {
  var stored = localStorage.getItem('odpt_keys_b64');
  if (stored) {
    try {
      var decoded = atob(stored);
      var parts = decoded.split('|');
      parts.forEach(function(pair) {
        var idx = pair.indexOf(':');
        if (idx > 0) {
          var name = pair.substring(0, idx).trim();
          var value = pair.substring(idx + 1).trim();
          if (name === 'ODPT_CENTER') document.getElementById('centerKey').value = value;
          if (name === 'CHALLENGE_2026') document.getElementById('challengeKey').value = value;
        }
      });
    } catch(e) {}
  }
});
</script>
</body>
</html>
