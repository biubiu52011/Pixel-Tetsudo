name: Sync canonical vehicle evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tools/export-vehicle-operation-evidence.js"
      - "tools/canonical-evidence-snapshot-guard.test.js"
      - ".github/workflows/sync-vehicle-evidence.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: vehicle-evidence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check sync credentials
        id: credentials
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Canonical evidence sync blocked: missing repository secret SUPABASE_URL."
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Canonical evidence sync blocked: configure repository secret SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Export canonical Supabase evidence
        if: steps.credentials.outputs.ready == 'true'
        run: node tools/export-vehicle-operation-evidence.js
      - name: Verify ambiguity policy
        if: steps.credentials.outputs.ready == 'true'
        run: node tools/canonical-evidence-ambiguity.test.js
      - name: Verify generated snapshot
        if: steps.credentials.outputs.ready == 'true'
        run: node tools/canonical-evidence-snapshot-guard.test.js
      - name: Prepare reviewed snapshot candidate
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if git diff --quiet -- data/timetables/vehicle-operation-evidence.json data/timetables/vehicle-operation-evidence-data.js; then
            echo "Canonical evidence snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetables/vehicle-operation-evidence.json data/timetables/vehicle-operation-evidence-data.js
          git commit -m "Sync canonical vehicle operation evidence"
          candidate="codex/vehicle-evidence-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$candidate"
          gh workflow run ci-cd.yml --ref "$candidate"
          echo "### Canonical evidence candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate branch: $candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "CI dispatched on the candidate commit. Review and open a PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$candidate?expand=1" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository policy keeps Actions PR creation/approval disabled; no direct main push or automatic merge is attempted." >> "$GITHUB_STEP_SUMMARY"
