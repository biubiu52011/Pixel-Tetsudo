name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/runtime-*"]
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: 'Optional retained production-verified CI run ID to restore'
        required: false
        type: string

permissions:
  contents: read

# Cancel superseded PR validation only. A production publication must finish
# before the next main workflow enters the single Pages environment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-guards:
    uses: ./.github/workflows/release-guards.yml

  browser-replay:
    name: Fixed HAR browser replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Replay four railway capabilities in Chromium
        run: |
          mkdir -p .work/browser-replay
          node tools/browser-replay-server.cjs > .work/browser-replay/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent 'http://127.0.0.1:8789/__replay-data?case=Agatsuma' > /dev/null && break
            sleep 1
          done
          node tools/run-browser-replay.cjs
      - name: Keep browser metrics and failures for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-replay-metrics
          path: .work/browser-replay

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Contract integrity against the protected base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node tools/run-contract-guard.cjs
      - name: Release identity and contract guard regression
        run: |
          node tools/release-bundle.test.js
          node tools/contract-change-guard.test.js
      - name: Deployment gate contract
        run: node tools/deployment-gate.test.js

      - name: Check Brace Balance
        run: python .github/workflows/brace_balance_check.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Runtime ownership and semantic change contracts
        run: |
          node tools/runtime-architecture-guard.test.js
          node tools/runtime-change-contract.test.js

      - name: Fixed HAR decision replay and computation budget
        run: |
          node tools/runtime-har-replay.test.js
          node tools/running-chain-har-replay.test.js

      - name: Unified request and captured SQL contract
        run: node tools/runtime-request-contract.test.js

      - name: Railway browser cross-page contract
        run: node --test tests/railway-browser-contract.test.cjs

      - name: Service-day and SQL/ODPT through-chain regression
        run: node --test tests/train-position-service-day.test.cjs

      - name: Terminal bounds, position ownership and passenger train list
        run: |
          node tools/train-terminal-consistency.test.js
          node tools/train-fold-layout.test.js

      - name: RunInfo semantic and identity tests
        run: |
          node tools/runinfo-evaluator.test.js
          node tools/runinfo-scope.test.js
          node tools/runinfo-loading-state.test.js
          node tools/performance-lifecycle.test.js

      - name: Vehicle regression 01 - candidate-map integrity (zero-fallback runtime)
        run: node tools/train_vehicle_mapping_guard.js

      - name: Vehicle regression 02 - train-position-evidence-regression.test.js
        run: node tools/train-position-evidence-regression.test.js

      - name: Vehicle regression 03 - asakusa-formation-evidence.test.js
        run: node tools/asakusa-formation-evidence.test.js

      - name: Vehicle regression 04 - operation-evidence-providers.test.js
        run: node tools/operation-evidence-providers.test.js

      - name: Vehicle regression 05 - formation-evidence-providers.test.js
        run: node tools/formation-evidence-providers.test.js

      - name: Vehicle regression 06 - hibiya-formation-evidence.test.js
        run: node tools/hibiya-formation-evidence.test.js

      - name: Vehicle regression 07 - oimachi-formation-evidence.test.js
        run: node tools/oimachi-formation-evidence.test.js

      - name: Vehicle regression 08 - iketama-formation-evidence.test.js
        run: node tools/iketama-formation-evidence.test.js

      - name: Vehicle regression 09 - keiyo-operation-evidence.test.js
        run: node tools/keiyo-operation-evidence.test.js

      - name: Vehicle regression 10 - tozai-operation-evidence.test.js
        run: node tools/tozai-operation-evidence.test.js

      - name: Vehicle regression 11 - operation-code-normalization.test.js
        run: node tools/operation-code-normalization.test.js

      - name: Vehicle regression 12 - seibu-shinjuku-evidence.test.js
        run: node tools/seibu-shinjuku-evidence.test.js

      - name: Vehicle regression 13 - odakyu-operation-evidence.test.js
        run: node tools/odakyu-operation-evidence.test.js

      - name: Vehicle regression 14 - odakyu-formation-evidence.test.js
        run: node tools/odakyu-formation-evidence.test.js

      - name: Vehicle regression 15 - sotetsu-formation-evidence.test.js
        run: node tools/sotetsu-formation-evidence.test.js

      - name: Vehicle regression 16 - denentoshi-formation-evidence.test.js
        run: node tools/denentoshi-formation-evidence.test.js

      - name: Vehicle regression 17 - canonical-evidence-ambiguity.test.js
        run: node tools/canonical-evidence-ambiguity.test.js

      - name: Vehicle regression 18 - canonical snapshot guard
        run: node tools/canonical-evidence-snapshot-guard.test.js

      - name: Vehicle regression 19 - zero-fallback vehicle identity policy
        run: node tools/vehicle-no-guess-policy.test.js

      - name: Vehicle regression 20 - zero-fallback source guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vehicle = fs.readFileSync('js/train-vehicle.js', 'utf8');
          const icons = vehicle;
          const forbidden = [
            [icons, 'return LINE_ICONS[lineId]', 'line vehicle fallback'],
            [icons, 'return OPERATOR_ICONS[opKey]', 'operator vehicle fallback'],
            [icons, '_poolPickByIcon', 'fleet hash fallback'],
            [vehicle, "chosenSrc = 'map'", 'VehicleTypeMap promotion'],
            [vehicle, "chosenSrc = 'trainNo'", 'train-number promotion'],
            [vehicle, 'parts.slice(i).join', 'train-number prefix fallback'],
            [fs.readFileSync('js/trains-render.js', 'utf8'), 'TrainVehicle.resolve(_vrCtx)', 'renderer vehicle re-resolution'],
            [fs.readFileSync('js/trains-render.js', 'utf8'), '__trainIconCache', 'renderer vehicle icon cache'],
            [fs.readFileSync('js/data-fusion.js', 'utf8'), '_rtVehicle.source === "trainNo"', 'train-number realtime promotion'],
            [fs.readFileSync('js/data-fusion.js', 'utf8'), 'positionData.trainClass = positionData.trainClass || resolveTrainClass', 'DataFusion trainClass fallback'],
            [fs.readFileSync('js/train-position-estimator.js', 'utf8'), 'tobu-official-2026-timetable-service-name', 'service-name vehicle inference'],
            [fs.readFileSync('js/train-position-estimator.js', 'utf8'), 'TrainVehicle.registerVehicle', 'estimator train-number history accumulation'],
            [fs.readFileSync('js/data-fusion.js', 'utf8'), 'TrainVehicle.registerVehicle', 'fusion train-number history accumulation'],
            [vehicle, 'getCandidates(trainNumber, operator).forEach', 'runtime train-number candidate import'],
            [vehicle, 'VehicleTypeMap.resolve(lineId, trainType, dest)', 'runtime static map candidate import'],
            [vehicle, 'TRAIN_NO_VEHICLE', 'legacy train-number vehicle table'],
            [vehicle, 'registerVehicle:', 'legacy vehicle registration API'],
            [vehicle, 'getCandidates:', 'legacy train-number candidate API'],
            [vehicle, 'ownerMatchesCandidate', 'owner-based vehicle narrowing'],
            [vehicle, 'filterCandidatesByOwner', 'owner-based candidate filtering'],
            [icons, 'FLEET_ICON_POOLS', 'fleet artwork pool'],
            [icons, 'LINE_VEHICLE_OVERRIDES', 'line vehicle override table'],
            [icons, 'LINE_ICON_NAME_REDIRECT', 'line identity redirect table'],
            [icons, 'VEHICLE_NAME_ALIASES', 'identity-changing vehicle alias table'],
            [icons, 'LINE_ICON_CANONICAL_IDS', 'line-to-canonical vehicle defaults'],
            [icons, 'LINE_ICONS: LINE_ICONS', 'public line vehicle default API'],
            [icons, 'OPERATOR_ICONS: OPERATOR_ICONS', 'public operator vehicle default API'],
            [icons, 'var LINE_ICONS', 'line vehicle fallback table'],
            [icons, 'var OPERATOR_ICONS', 'operator vehicle fallback table'],
            [icons, 'TRAIN_TYPE_ICON_RULES', 'train-type/number vehicle guess rules'],
            [icons, 'LINE_ICON_OVERRIDES', 'line vehicle override rules'],
            [icons, 'THROUGH_SUFFIX_RULES', 'through-service suffix vehicle guess rules'],
            [icons, 'THROUGH_PREFIX_RULES', 'through-service prefix vehicle guess rules'],
            [icons, 'VEHICLE_DEPLOYMENTS', 'route/deployment vehicle inference table'],
            [icons, 'buildVehicleNameIndex', 'artwork-filename vehicle identity inference'],
            [icons, 'collectIcon(', 'recursive artwork reverse-index inference'],
            [icons, 'EXTRA_VEHICLE_ICONS', 'gallery artwork registry used as identity source'],
            [icons, '"toky5500":', 'internal asset locator exposed as vehicle identity'],
            [icons, '"twr71000":', 'internal asset locator exposed as vehicle identity'],
            [icons, '"mn-tma1000":', 'internal asset locator exposed as vehicle identity']
          ];
          for (const [src, needle, label] of forbidden) {
            if (src.includes(needle)) throw new Error('zero-fallback violation: ' + label);
          }
          console.log('zero-fallback source guard: PASS');
          NODE

      - name: Vehicle regression 21 - train vehicle icon resolution chain
        run: node tools/train-vehicle-icon-resolution.test.js

      - name: Metro official current single-family fleet evidence
        run: node tools/metro-single-fleet-evidence.test.js

      - name: Continuous live and SQL position refresh
        run: node tools/position-refresh-continuity.test.js
      - name: Saikyo and Sotetsu JR through model references
        run: node tools/saikyo-sotetsu-vehicle.test.js
      - name: Scoped planned fleet and full itinerary constraints
        run: node tools/scoped-planned-vehicle-rules.test.js
      - name: Verify Odakyu train-number vehicle plans
        run: node tools/odakyu-planned-vehicles.test.js
      - name: Metro shared physical tracks
        run: node tools/metro-shared-tracks.test.js
      - name: Metro recurring working vehicle plans
        run: node tools/metro-working-plans.test.js
      - name: Mita Namboku planned working families
        run: node tools/mita-namboku-working-plans.test.js
      - name: All subway planned vehicle coverage
        run: node tools/subway-planned-vehicles.test.js
      - name: Planned vehicle candidates and live timetable continuity
        run: node tools/planned-vehicle-inference.test.js
      - name: Unified vehicle pipeline and late evidence recovery
        run: node tools/train-vehicle-pipeline.test.js

      - name: JR regular train model references and through-service isolation
        run: node tools/jr-regular-reference-vehicles.test.js

      - name: Entity Preservation Guard
        run: |
          echo Running canonical entity preservation guard...
          python .github/workflows/ci_guard_check.py

      - name: Architecture Integrity Guard
        run: |
          echo Running architecture integrity guard...
          python .github/workflows/arch_guard_check.py

      - name: Home UI Integrity Guard
        run: |
          echo Running home UI integrity guard...
          python .github/workflows/home_ui_guard_check.py

      - name: Check No localhost
        run: |
          echo "Checking for localhost/127.0.0.1 references..."
          count=$(grep -r "localhost\\|127\\.0\\.0\\.1" js pages css --include="*.js" --include="*.html" --include="*.css" 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::error::Found $count localhost/127.0.0.1 references"
            grep -rn "localhost\\|127\\.0\\.0\\.1" js pages css --include="*.js" --include="*.html" --include="*.css"
            exit 1
          fi
          echo "No localhost references found"

      - name: Check Inline Styles (CSP)
        run: |
          echo "Checking for inline styles..."
          count=$(grep -rn 'style="[^"]*"' pages/*.html 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::warning::Found $count inline style attributes (may violate CSP)"
            grep -rn 'style="[^"]*"' pages/*.html
          else
            echo "No inline styles found"
          fi

  build:
    name: Build verified release
    needs: [validate, release-guards, browser-replay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      previous_run_id: ${{ steps.previous.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Find previous verified release
        id: previous
        if: github.ref == 'refs/heads/main'
        run: node tools/release-history.cjs select
      - name: Validate requested rollback
        if: inputs.rollback_run_id
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node tools/release-history.cjs select "$ROLLBACK_RUN_ID"
      - name: Download verified rollback artifact
        if: inputs.rollback_run_id
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .work/restore
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
      - name: Restore exact previous bytes
        if: inputs.rollback_run_id
        run: |
          mkdir _site
          tar -xf .work/restore/artifact.tar -C _site
          node tools/release-history.cjs check-bundle _site
      - name: Build immutable release once
        if: ${{ !inputs.rollback_run_id }}
        env:
          BUILD_SHA: ${{ github.sha }}
        run: node tools/release-bundle.cjs build
      - name: Check complete release inventory
        run: node tools/release-bundle.cjs check _site
      - name: Exercise the staged production bundle
        run: |
          python -m http.server 8790 --bind 127.0.0.1 --directory _site > /tmp/pixel-release-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8790/release-manifest.json > /dev/null && break
            sleep 1
          done
          node tools/run-browser-replay.cjs --production http://127.0.0.1:8790/
      - name: Keep staged bundle acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-release-verification
          path: .work/production-browser
      - name: Retain canonical release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, release-guards, browser-replay, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production release
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .work/release-artifact
      - name: Recover expected immutable release
        run: |
          mkdir _site
          tar -xf .work/release-artifact/artifact.tar -C _site
      - name: Verify production SHA and resource hashes
        env:
          RELEASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/release-bundle.cjs verify _site "$RELEASE_URL" .work/release-verification.json
      - name: Verify production navigation and mounted UI
        env:
          RELEASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/run-browser-replay.cjs --production "$RELEASE_URL"
      - name: Retain release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-verification
          retention-days: 90
          path: |
            _site/release-manifest.json
            .work/release-verification.json
            .work/production-browser

  rollback:
    name: Restore previous verified release
    needs: [build, deploy, verify-production]
    if: always() && github.ref == 'refs/heads/main' && (needs.deploy.result == 'failure' || (needs.deploy.result == 'success' && needs.verify-production.result == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require an actual verified rollback target
        env:
          PREVIOUS_RUN_ID: ${{ needs.build.outputs.previous_run_id }}
        run: |
          echo '::error::Production acceptance failed. Restoring the previous verified artifact.'
          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo '::error::No retained verified release exists yet. Automatic rollback is unavailable; production requires maintainer attention.'
            exit 1
          fi
          node tools/release-history.cjs select "$PREVIOUS_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ needs.build.outputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: .work/rollback-artifact
      - name: Check rollback bytes and provenance
        run: |
          mkdir _site
          tar -xf .work/rollback-artifact/artifact.tar -C _site
          node tools/release-history.cjs check-bundle _site
      - uses: actions/configure-pages@v5
      - name: Repackage unchanged verified bytes for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: rollback-pages
          retention-days: 90
      - name: Publish verified rollback
        id: restored
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages
      - name: Verify restored production release
        env:
          RELEASE_URL: ${{ steps.restored.outputs.page_url }}
        run: |
          node tools/release-bundle.cjs verify _site "$RELEASE_URL" .work/rollback-verification.json
          node tools/run-browser-replay.cjs --production "$RELEASE_URL"
      - name: Retain rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-verification
          retention-days: 90
          path: |
            _site/release-manifest.json
            .work/rollback-verification.json
            .work/production-browser
