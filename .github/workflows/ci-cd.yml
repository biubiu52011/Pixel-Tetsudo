name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JS Syntax with Node
        run: |
          echo "Checking JS syntax..."
          errors=0
          for f in $(find js data -name '*.js' 2>/dev/null | sort); do
            if ! node --check "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::JS syntax errors found in $errors file(s)"
            exit 1
          fi
          echo "All JS files pass syntax check"

      - name: Check Brace Balance
        run: |
          echo "Checking brace balance..."
          errors=0
          for f in $(find js data -name '*.js' 2>/dev/null | sort); do
            opens=$(grep -o '{' "$f" | wc -l)
            closes=$(grep -o '}' "$f" | wc -l)
            if [ $opens -ne $closes ]; then
              echo "FAIL: $f (open=$opens close=$closes)"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::Brace imbalance in $errors file(s)"
            exit 1
          fi
          echo "All JS files have balanced braces"

      - name: Check Canonical Data
        run: |
          echo "Checking railway_data.json SHA..."
          expected="D759E38E5F54C0077137F4E137D0F32CD4DEBB01C6FDB68D5658C2B421E7677B"
          actual=$(sha256sum data/core/railway_data.json | cut -d' ' -f1)
          echo "Expected: $expected"
          echo "Actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Canonical SHA mismatch! Do not modify railway_data.json"
            exit 1
          fi
          echo "Canonical data OK"

      - name: Check No localhost
        run: |
          echo "Checking for localhost/127.0.0.1 references..."
          count=$(grep -r "localhost\|127\.0\.0\.1" js pages css --include="*.js" --include="*.html" --include="*.css" 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::error::Found $count localhost/127.0.0.1 references"
            grep -rn "localhost\|127\.0\.0\.1" js pages css --include="*.js" --include="*.html" --include="*.css"
            exit 1
          fi
          echo "No localhost references found"

      - name: Check Inline Styles (CSP)
        run: |
          echo "Checking for inline styles..."
          count=$(grep -rn 'style="[^"]*"' pages/*.html 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::warning::Found $count inline style attributes (may violate CSP)"
            grep -rn 'style="[^"]*"' pages/*.html
          else
            echo "No inline styles found"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
