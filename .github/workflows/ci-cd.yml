name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Brace Balance
        run: python .github/workflows/brace_balance_check.py

      - name: Entity Preservation Guard
        run: |
          echo Running canonical entity preservation guard...
          python .github/workflows/ci_guard_check.py

      - name: Architecture Integrity Guard
        run: |
          echo Running architecture integrity guard...
          python .github/workflows/arch_guard_check.py

      - name: Home UI Integrity Guard
        run: |
          echo Running home UI integrity guard...
          python .github/workflows/home_ui_guard_check.py

      - name: Check No localhost
        run: |
          echo "Checking for localhost/127.0.0.1 references..."
          count=$(grep -r "localhost\\|127\\.0\\.0\\.1" js pages css --include="*.js" --include="*.html" --include="*.css" 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::error::Found $count localhost/127.0.0.1 references"
            grep -rn "localhost\\|127\\.0\\.0\\.1" js pages css --include="*.js" --include="*.html" --include="*.css"
            exit 1
          fi
          echo "No localhost references found"

      - name: Check Inline Styles (CSP)
        run: |
          echo "Checking for inline styles..."
          count=$(grep -rn 'style="[^"]*"' pages/*.html 2>/dev/null | wc -l)
          if [ $count -gt 0 ]; then
            echo "::warning::Found $count inline style attributes (may violate CSP)"
            grep -rn 'style="[^"]*"' pages/*.html
          else
            echo "No inline styles found"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
