name: Temporary Yamanote station-index browser regression
on:
  push:
    branches: [fix/yamanote-canonical-station-indices-20261012]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Compare old and fixed geometry and real train station indices
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-station-index-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const device of [{name:'desktop',width:1190,height:850},{name:'mobile',width:390,height:830}]){
              const pages=await Promise.all(['https://biubiu52011.github.io/Pixel-Tetsudo/pages/trains.html#Yamanote','http://127.0.0.1:8765/pages/trains.html#Yamanote'].map(()=>browser.newPage({viewport:{width:device.width,height:device.height},timezoneId:'Asia/Tokyo',locale:'ja-JP'})));
              const [oldPage,newPage]=pages;
              const errors=[];
              pages.forEach((p,i)=>p.on('pageerror',e=>errors.push((i?'fixed':'baseline')+': '+String(e).slice(0,150))));
              try{
                await Promise.all(pages.map((p,i)=>p.goto(i?'http://127.0.0.1:8765/pages/trains.html#Yamanote':'https://biubiu52011.github.io/Pixel-Tetsudo/pages/trains.html#Yamanote',{waitUntil:'domcontentloaded',timeout:50000})));
                await Promise.all(pages.map(p=>p.waitForFunction(()=>document.querySelector('#trainsMapContainer svg')?.__geometry?.stationCoords?.length===30,{timeout:30000})));
                await Promise.all(pages.map(p=>p.waitForTimeout(7500)));
                const read=()=>({
                  line:(window.UNIFIED_LINES?.Yamanote?.stations||[]),
                  stations:(document.querySelector('#trainsMapContainer svg')?.__geometry?.stationCoords||[]).map(x=>({id:x.stationId,x:x.x,y:x.y,side:x.side})),
                  svgViewBox:document.querySelector('#trainsMapContainer svg')?.getAttribute('viewBox'),
                  syntheticStationFor24:(()=>{const g=document.querySelector('#trainsMapContainer svg')?.__geometry; if(!g)return null; const p={stationIndex:24,segmentToIndex:24,segmentProgress:0.5,railDirection:'OuterLoop',trainId:'test:shinagawa'}; const loc=window.TrainTrackLayout?.resolveAll([p],g.stationCoords,g,'Yamanote',{getDisplayMoveDir:()=>null})?.[0];return loc?{mappedStation:g.stationCoords[loc.idx]?.stationId,x:loc.x,y:loc.y}:null;})(),
                  pos:(window.DataFusion?.getRealtimePositions('Yamanote')||[]).map(p=>({num:p.trainNumber,idx:p.stationIndex,src:p.positionSource,id:p.runningChainId})),
                  markers:[...document.querySelectorAll('.train-layer [data-train-id]')].length
                });
                const before=await oldPage.evaluate(read),after=await newPage.evaluate(read);
                function stationMap(rows){return Object.fromEntries(rows.map(x=>[x.id,[x.x,x.y,x.side]]));}
                const beforeMap=stationMap(before.stations),afterMap=stationMap(after.stations);
                const movedStationIds=Object.keys(beforeMap).filter(id=>JSON.stringify(beforeMap[id])!==JSON.stringify(afterMap[id]));
                const mismatch=rows=>rows.filter((x,i)=>x.id!==after.line[i]).map((x,i)=>({id:x.id,index:i,expected:after.line[i]}));
                const oldMismatch=before.stations.filter((x,i)=>x.id!==before.line[i]).length;
                const newMismatch=after.stations.filter((x,i)=>x.id!==after.line[i]).length;
                const sourceHarajuku=after.line.indexOf('Harajuku');
                const sourceShinagawa=after.line.indexOf('Shinagawa');
                const out={device:device.name,oldMismatch,newMismatch,movedStationIds,viewBoxBefore:before.svgViewBox,viewBoxAfter:after.svgViewBox,harajukuIndex:sourceHarajuku,harajukuOldRow:before.stations[sourceHarajuku]?.id,harajukuNewRow:after.stations[sourceHarajuku]?.id,shinagawaIndex:sourceShinagawa,shinagawaOldRow:before.stations[sourceShinagawa]?.id,shinagawaNewRow:after.stations[sourceShinagawa]?.id,syntheticBefore:before.syntheticStationFor24,syntheticAfter:after.syntheticStationFor24,vehicleCountBefore:before.pos.length,vehicleCountAfter:after.pos.length,markersBefore:before.markers,markersAfter:after.markers,errors};
                console.log('CANONICAL_DIAG '+JSON.stringify(out));
                if(before.line.length!==30||after.line.length!==30||oldMismatch===0||newMismatch!==0||movedStationIds.length!==0||before.svgViewBox!==after.svgViewBox||before.syntheticStationFor24?.mappedStation!=='Harajuku'||after.syntheticStationFor24?.mappedStation!=='Shinagawa'||errors.length>0)throw new Error('Source-index repair or unchanged station geometry failed '+JSON.stringify(out));
              }catch(e){console.log('BROWSER_CHECK_FAILED '+String(e));process.exitCode=1;}
              await Promise.all(pages.map(p=>p.close()));
            }
            await browser.close();
          })();
          NODE
