name: One-time ODPT key vs public comparison
on:
  push:
    paths:
      - ".github/workflows/odpt-key-compare-once.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Compare public and authenticated Toei trains without disclosing key
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          function getKey() {
            if(process.env.ODPT_CONSUMER_KEY) return {key:process.env.ODPT_CONSUMER_KEY,source:"actions-secret"};
            // Fallback to precisely the runtime's already-existing API link catalogue.
            const src=fs.readFileSync("data/api/odpt-links.js","utf8");
            const m=src.match(/ODPT_LINKS_ENC\s*=\s*"([A-Za-z0-9+/=]+)"/);
            if(!m)return {key:"",source:"missing"};
            const seed="PixelTetsudo".split("").reverse().join("")+"-"+"ODPT".split("").reverse().join("")+"-2026";
            const bytes=Buffer.from(m[1],"base64");
            for(let i=0;i<bytes.length;i++)bytes[i]^=seed.charCodeAt(i%seed.length);
            const urls=JSON.parse(bytes.toString("utf8"));
            const u=urls.map(x=>{try{return new URL(x)}catch{return null}})
              .find(x=>x&&x.hostname==="api.odpt.org"&&x.searchParams.has("acl:consumerKey"));
            return {key:u?.searchParams.get("acl:consumerKey")||"",source:"existing-runtime-catalog"};
          }
          const detail=(v)=> {
            const a=(Array.isArray(v)?v:[]);
            const toid=x=>String(x["owl:sameAs"]||x["@id"]||"");
            const lines={};for(const x of a){
              const line=String(x["odpt:railway"]||"unknown").split(".").pop();
              if(!lines[line])lines[line]={records:0,model:0,car:0,owner:0,odptTrip:0,literalCar:0};
              const st=lines[line];st.records++;
              if(x["odpt:vehicleType"]||x.vehicleType)st.model++;
              if(x["odpt:carNumber"]||x.carNumber||x.vehicleCarNumber)st.car++;
              if(x["odpt:trainOwner"]||x.trainOwner)st.owner++;
              const n=String(x["odpt:trainNumber"]||"");
              if(/^ODPT[0-9]+$/i.test(n))st.odptTrip++;
              if(/^[0-9]{4}$/.test(n))st.literalCar++;
            }
            const target=a.find(x=>String(x["odpt:trainNumber"]||"")==="ODPT2898");
            return {total:a.length,lines,arakawaTripIds:a.filter(x=>x["odpt:railway"]==="odpt.Railway:Toei.Arakawa").map(x=>String(x["odpt:trainNumber"]||"")).slice(0,12),
              has2898:!!target,fields2898:target?Object.keys(target).sort():[],
              fieldNamesArakawa:a.find(x=>x["odpt:railway"]==="odpt.Railway:Toei.Arakawa")?Object.keys(a.find(x=>x["odpt:railway"]==="odpt.Railway:Toei.Arakawa")).sort():[] ,
              identities:new Set(a.map(toid).filter(Boolean))};
          };
          (async()=>{
            let key;
            try{key=getKey()}catch{key={key:"",source:"catalog-unavailable"}}
            console.log("KEY_SOURCE",key.source,"key-present",!!key.key);
            const pub="https://api-public.odpt.org/api/v4/odpt:Train?odpt:operator=odpt.Operator:Toei";
            const official=new URL("https://api.odpt.org/api/v4/odpt:Train");
            official.searchParams.set("odpt:operator","odpt.Operator:Toei");
            if(key.key)official.searchParams.set("acl:consumerKey",key.key);
            // Never print URL, query, auth headers, thrown fetch errors, or response bodies.
            const fetchOne=async(url)=>{
              try{
                const res=await fetch(url,{signal:AbortSignal.timeout(15000)});
                if(!res.ok)return {http:res.status,data:[]};
                const data=await res.json();
                return {http:res.status,data:Array.isArray(data)?data:[]};
              }catch(e){return {http:0,error:e?.name||"fetch-error",data:[]}}
            };
            const [p,k]=await Promise.all([fetchOne(pub),key.key?fetchOne(official):Promise.resolve({http:null,data:[]})]);
            const pd=detail(p.data),kd=detail(k.data);
            const comparable={};
            for(const line of new Set([...Object.keys(pd.lines),...Object.keys(kd.lines)]))
              comparable[line]={public:pd.lines[line]||null,keyed:kd.lines[line]||null};
            const overlap=[...pd.identities].filter(x=>kd.identities.has(x)).length;
            delete pd.identities;delete kd.identities;
            console.log("ODPT_COMPARISON",JSON.stringify({publicHttp:p.http,keyedHttp:k.http,keyedError:k.error||null,publicError:p.error||null,
              publicTime:new Date().toISOString(),public:pd,keyed:kd,overlapSameAs:overlap,byLine:comparable}));
          })();
          NODE
