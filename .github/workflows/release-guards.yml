name: Release Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Guards validate release-specific invariants only. Runtime regression tests
# belong to CI / CD, so the two workflows cannot drift on test discovery.
concurrency:
  group: release-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Frontend smoke
        run: node tools/frontend-smoke.test.js
      - name: Train image asset references
        run: node tools/train-image-assets.test.js
      - name: Reviewed PNG content lock
        run: node tools/vehicle-image-lock.test.js
      - name: Read-only gallery canonical parity
        run: node tools/gallery-sync.js
      - name: Canonical identity coverage
        run: node tools/line-identity-coverage.test.js
      - name: ODPT credential model
        run: node tools/odpt-credential-model.test.js
