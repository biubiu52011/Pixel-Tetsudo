name: Release Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend smoke
        run: node tools/frontend-smoke.test.js
      - name: Train image asset references
        run: node tools/train-image-assets.test.js
      - name: Canonical identity coverage
        run: node tools/line-identity-coverage.test.js
      - name: Existing running-chain tests
        shell: bash
        run: |
          set -e
          found=0
          for f in tools/*running-chain*.test.js; do
            [ -f "$f" ] || continue
            found=1
            echo "==> $f"
            node "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "No running-chain tests found"
            exit 1
          fi
